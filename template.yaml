AWSTemplateFormatVersion: "2010-09-09"
Description: Peminjaman Alat - ALB, Lambda, S3

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LaptopCidr:
    Type: String
  ShellCidr:
    Type: String
  RoleName:
    Type: String
    Default: LabRole

Conditions:
  HasShellRule: !Not [!Equals [!Ref LaptopCidr, !Ref ShellCidr]]

Resources:
  # Penyimpanan
  LoanBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-data-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Fungsi
  LoanFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-fn"
      Runtime: python3.12
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/${RoleName}"
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref LoanBucket
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": "Kode belum diunggah"}

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LoanFunction.Arn
      Principal: elasticloadbalancing.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # Jaringan
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP dari IP penguji
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref LaptopCidr
        - !If
          - HasShellRule
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Ref ShellCidr
          - !Ref AWS::NoValue

  # Load Balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: InvokePermission
    Properties:
      TargetType: lambda
      Targets:
        - Id: !GetAtt LoanFunction.Arn

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ApiUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}"
  BucketName:
    Value: !Ref LoanBucket
  FunctionName:
    Value: !Ref LoanFunction
